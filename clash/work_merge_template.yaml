# Clash Verge Rev Merge 模版 (个人工作定制版)
# 适用于个人办公电脑，包含公司内网 SSH 隧道 (127.0.0.1:1088) 与公司服务分流

rule-providers:
  sr-direct:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://fastly.jsdelivr.net/gh/SimileciWH/shadowrocket-config@main/clash/rules_direct.yaml"
    path: ./ruleset/sr-direct.yaml

  sr-proxy:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://fastly.jsdelivr.net/gh/SimileciWH/shadowrocket-config@main/clash/rules_proxy.yaml"
    path: ./ruleset/sr-proxy.yaml

  sr-company:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://fastly.jsdelivr.net/gh/SimileciWH/shadowrocket-config@main/clash/rules_company.yaml"
    path: ./ruleset/sr-company.yaml

# 预定义公司节点与策略组
proxies:
  - name: CORP-WINDOWS-NODE
    type: socks5
    server: 127.0.0.1
    port: 1088

prepend-proxy-groups:
  - name: CORP-WINDOWS
    type: select
    proxies:
      - CORP-WINDOWS-NODE
      - DIRECT
      - 节点选择

  - name: justg-vps-RU-direct
    type: select
    proxies:
      - 节点选择
      - DIRECT

# 优先匹配规则列表
prepend-rules:
  # 微信核心客户端进程直连（彻底保障 Mac & Windows 发文字、发图片、语音通话 100% 走本地直连）
  - PROCESS-NAME,WeChat,DIRECT
  - PROCESS-NAME,WeChat.exe,DIRECT
  - PROCESS-NAME,WeChatAppEx,DIRECT
  - PROCESS-NAME,WeChatAppEx.exe,DIRECT
  - PROCESS-NAME,Weixin,DIRECT
  - PROCESS-NAME,Weixin.exe,DIRECT
  - DOMAIN-KEYWORD,weixin,DIRECT
  - DOMAIN-KEYWORD,wechat,DIRECT
  - DOMAIN-KEYWORD,qpic,DIRECT
  - RULE-SET,sr-company,CORP-WINDOWS
  - RULE-SET,sr-proxy,节点选择
  - RULE-SET,sr-direct,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,节点选择

# DNS 增强配置：将微信/QQ/腾讯核心域名列入 fake-ip-filter 黑名单返回真实 IP，彻底解决图片上传拦截/超时
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.work.weixin.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "+.weixin.com"
    - "+.qpic.cn"
    - "+.qpic.com"
    - "+.qq.com"
    - "+.tencent.com"
    - "+.gtimg.com"
    - "+.gtimg.cn"
    - "+.qlogo.cn"
    - "+.weixinbridge.com"
    - "+.servicewechat.com"
    - "+.wechatpay.cn"
    - "+.tenpay.com"
    - "+.wechatos.net"
    - "+.tencent-cloud.net"
    - "+.tencent-cloud.cn"
    - "+.myqcloud.com"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
    # 抖音全系核心域名直连（返回真实 IP，彻底防止 ClipVault / 爬虫因 fake-ip 判定非公网拒绝连接）
    - "v.douyin.com"
    - "www.iesdouyin.com"
    - "www.douyin.com"
    - "+.douyin.com"
    - "+.iesdouyin.com"
    - "+.douyincdn.com"
    - "+.douyinpic.com"
    - "+.douyinstatic.com"
    - "+.douyinvod.com"
    - "+.zjcdn.com"
    - "+.ydycdn.com"
    - "+.bytednsdoc.com"
    - "+.byteimg.com"
    - "+.ibytedtos.com"

